<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />

    <!--
      Applies the saved theme before first paint so the page never flashes the
      wrong palette. Keep the storage key in sync with src/components/ThemeProvider.tsx.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("portfolio-theme");
          var theme =
            stored && stored !== "system"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* private mode / storage disabled - fall back to the light default */
        }
      })();
    </script>
    <!-- TODO: Set the document title to the name of your application -->
    <title>Portfolio</title>
    <link rel="icon" type="image/svg+xml" href="/k.jpg" />
    <meta name="description" content="My Portfolio" />
    <meta name="author" content="Koushik-Varma" />

    <!-- TODO: Update og:title to match your application name -->
    <meta property="og:title" content="Koushik Varma | Portfolio" />
    <meta property="og:description" content="Full stack Developer and an AI Engineer" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/socialmedia.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@kandykaushik" />
    <meta name="twitter:image" content="/socialmedia.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
